<!DOCTYPE html>
<html>
<head>
    <title>Testing Website</title>
    <style>
        body {
    font-family: Arial;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}
        input { width: 100%; padding: 8px; margin: 10px 0; }
        button { width: 100%; padding: 10px; margin: 10px 0; }
        .error { color: red; }
        .success { color: green; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="login" class="hidden">
        <h2 style="text-align: center">Welcome to the Test Website!</h2>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <div id="loginError" class="error"></div>
        <button onclick="login()">Login</button>
        <p><a href="#" onclick="showRegister()">Don't have an account? Sign up</a></p>
    </div>

    <div id="register">
        <h2 style="text-align: center">Create Your Account!</h2>
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPassword" placeholder="Password (8+ chars, 1 uppercase, 1 number)">
        <input type="password" id="regConfirm" placeholder="Confirm Password">
        <div id="regError" class="error"></div>
        <button onclick="register()">Register</button>
        <p><a href="#" onclick="showLogin()">Login</a></p>
    </div>

    <script>
        let user = { email: '', password: '' };

        function showLogin() {
            document.getElementById('login').classList.remove('hidden');
            document.getElementById('register').classList.add('hidden');
        }

        function showRegister() {
            document.getElementById('register').classList.remove('hidden');
            document.getElementById('login').classList.add('hidden');
        }

        function register() {
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const err = document.getElementById('regError');

            err.textContent = '';

            if (pass !== confirm) {
                err.textContent = ' Password mismatch!';
                return;
            }

            if (pass.length < 8 || !/[A-Z]/.test(pass) || !/[0-9]/.test(pass)) {
                err.textContent = 'Password must have 8+ chars, 1 uppercase, 1 number!';
                return;
            }

            user = { email, password: pass };
            err.innerHTML = '<span class="success">✓ Account created! Go to Login.</span>';
        }

        function login() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const err = document.getElementById('loginError');

            if (email === user.email && pass === user.password) {
                alert('✓ Login successful!');
                document.getElementById('loginEmail').value = '';
                document.getElementById('loginPassword').value = '';
            } else {
                err.textContent = '❌ Invalid Credentials';
            }
        }
    </script>
</body>
</html>
