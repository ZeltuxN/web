	<title>Sign in | Testing Website</title>
	<style>
		:root { color-scheme: light; }
		* { box-sizing: border-box; }
		body {
			font-family: Arial, sans-serif;
			min-height: 100vh;
			margin: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 24px;
			background: #808080;
		}
		.card {
			background: #fff;
			padding: 32px;
			border-radius: 10px;
			box-shadow: 0 2px 14px rgba(0,0,0,0.16);
			width: min(100%, 360px);
		}
		h2 { margin: 0 0 24px; text-align: center; }
		label {
			display: block;
			font-size: 13px;
			font-weight: 600;
			color: #333;
			margin-bottom: 4px;
		}
		input {
			width: 100%;
			padding: 9px;
			margin: 0 0 14px;
			border: 1px solid #ccc;
			border-radius: 4px;
		}
		.password-field { position: relative; margin-bottom: 14px; }
		.password-field input { margin: 0; padding-right: 44px; }
		.password-toggle {
			position: absolute;
			top: 1px;
			right: 1px;
			width: 40px;
			height: calc(100% - 2px);
			margin: 0;
			padding: 0;
			background: transparent;
			color: #4b5563;
			border-radius: 3px;
		}
		.password-toggle:hover { background: #f3f4f6; filter: none; }
		.password-toggle:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
		.password-toggle svg { display: block; width: 20px; height: 20px; margin: auto; }
		.password-toggle { z-index: 2; display: flex; align-items: center; justify-content: center; }
		input::-ms-reveal, input::-ms-clear { display: none; }
		.remember { display: flex; align-items: center; gap: 7px; font-weight: 400; }
		.remember input { width: auto; margin: 0; }
		button {
			width: 100%;
			padding: 10px;
			margin: 10px 0 0;
			background: #2563eb;
			color: #fff;
			font: inherit;
			font-weight: 600;
			border: none;
			border-radius: 4px;
			cursor: pointer;
		}
		button:hover { filter: brightness(0.92); }
		button:disabled { cursor: wait; opacity: 0.65; }
		.google { background: #db4437; }
		.github { background: #24292e; }
		.microsoft { background: #2f2f2f; }
		.divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 2px; color: #666; font-size: 12px; }
		.divider::before, .divider::after { content: ""; height: 1px; background: #ddd; flex: 1; }
		.message { min-height: 18px; margin-top: 8px; font-size: 13px; text-align: center; }
		.error { color: #b91c1c; }
		.hidden { display: none; }
		a { color: #2563eb; text-decoration: none; }
		p { text-align: center; font-size: 14px; margin-bottom: 0; }
	</style>
</head>
<body>
	<main>
		<section id="login" class="card" aria-labelledby="loginTitle">
			<h2 id="loginTitle">Welcome back</h2>
			<label for="loginEmail">Email</label>
			<input type="email" id="loginEmail" autocomplete="email">
			<label for="loginPassword">Password</label>
			<div class="password-field">
				<input type="password" id="loginPassword" autocomplete="current-password">
				<button class="password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Show password" aria-pressed="false">
					<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
						<circle cx="12" cy="12" r="3"/>
					</svg>
				</button>
			</div>
			<label class="remember">
				<input type="checkbox" id="rememberMe"> Remember email
			</label>
			<div id="loginError" class="message error" role="status" aria-live="polite"></div>
			<button type="button" data-auth-button onclick="login()">Sign in</button>
			<div class="divider">or continue with</div>
			<button type="button" data-auth-button class="google" onclick="loginWithGoogle()">Google</button>
			<button type="button" data-auth-button class="github" onclick="loginWithGithub()">GitHub</button>
			<button type="button" data-auth-button class="microsoft" onclick="loginWithMicrosoft()">Microsoft</button>
			<p><a href="#" onclick="showRegister(); return false;">Don't have an account? Sign up</a></p>
		</section>

		<section id="register" class="card hidden" aria-labelledby="registerTitle">
			<h2 id="registerTitle">Create your account</h2>
			<label for="regEmail">Email</label>
			<input type="email" id="regEmail" autocomplete="email" required>
			<label for="regPassword">Password (8+ chars, 1 uppercase, 1 number)</label>
			<div class="password-field">
				<input type="password" id="regPassword" autocomplete="new-password">
				<button class="password-toggle" type="button" data-password-toggle="regPassword" aria-label="Show password" aria-pressed="false">
					<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
						<circle cx="12" cy="12" r="3"/>
					</svg>
				</button>
			</div>
			<label for="regConfirm">Confirm password</label>
			<div class="password-field">
				<input type="password" id="regConfirm" autocomplete="new-password">
				<button class="password-toggle" type="button" data-password-toggle="regConfirm" aria-label="Show password" aria-pressed="false">
					<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
						<circle cx="12" cy="12" r="3"/>
					</svg>
				</button>
			</div>
			<div id="regError" class="message error" role="status" aria-live="polite"></div>
			<button type="button" data-auth-button onclick="register()">Register</button>
			<p><a href="#" onclick="showLogin(); return false;">Already have an account? Sign in</a></p>
		</section>
	</main>

	<script>
		document.querySelectorAll('[data-password-toggle]').forEach((button) => {
			button.addEventListener('click', () => {
				const input = document.getElementById(button.dataset.passwordToggle);
				if (!input) return;
				const willShow = input.type === 'password';
				input.type = willShow ? 'text' : 'password';
				button.setAttribute('aria-pressed', String(willShow));
				button.setAttribute('aria-label', willShow ? 'Hide password' : 'Show password');
				input.focus({ preventScroll: true });
			});
		});
	</script>

	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
		import {
			getAuth,
			createUserWithEmailAndPassword,
			signInWithEmailAndPassword,
			GoogleAuthProvider,
			GithubAuthProvider,
			OAuthProvider,
			signInWithPopup,
			setPersistence,
			browserLocalPersistence,
			onAuthStateChanged
		} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

		const firebaseConfig = {
			apiKey: "AIzaSyBcFRqMGQaeyyIvJywiiQok5NlJeTCh4PQ",
			authDomain: "testwebsite-f8d84.firebaseapp.com",
			projectId: "testwebsite-f8d84",
			storageBucket: "testwebsite-f8d84.firebasestorage.app",
			messagingSenderId: "1045773600438",
			appId: "1:1045773600438:web:04b719210a917afd330817",
			measurementId: "G-RWK2WYQ8C4"
		};

		const app = initializeApp(firebaseConfig);
		const auth = getAuth(app);
		const persistenceReady = setPersistence(auth, browserLocalPersistence).catch(() => undefined);
		let authActionInProgress = false;

		function setCookie(name, value, days) {
			const maxAge = Math.max(0, Math.round(days * 86400));
			const secure = location.protocol === 'https:' ? '; Secure' : '';
			document.cookie = `${name}=${encodeURIComponent(value)}; Max-Age=${maxAge}; Path=/; SameSite=Lax${secure}`;
		}

		function getCookie(name) {
			const match = document.cookie.match(new RegExp(`(?:^|; )${name}=([^;]*)`));
			return match ? decodeURIComponent(match[1]) : null;
		}

		function setBusy(isBusy) {
			document.querySelectorAll('[data-auth-button]').forEach((button) => {
				button.disabled = isBusy;
			});
		}

		function goToDashboard() {
			window.location.assign('website.html');
		}

		window.showLogin = function () {
			document.getElementById('login').classList.remove('hidden');
			document.getElementById('register').classList.add('hidden');
			document.getElementById('loginError').textContent = '';
		};

		window.showRegister = function () {
			document.getElementById('register').classList.remove('hidden');
			document.getElementById('login').classList.add('hidden');
			document.getElementById('regError').textContent = '';
		};

		window.register = async function () {
			if (authActionInProgress) return;
			const email = document.getElementById('regEmail').value.trim();
			const pass = document.getElementById('regPassword').value;
			const confirm = document.getElementById('regConfirm').value;
			const err = document.getElementById('regError');
			err.textContent = '';

			if (!email || !pass || !confirm) {
				err.textContent = 'All fields are required.';
				return;
			}
			if (pass !== confirm) {
				err.textContent = 'Passwords do not match.';
				return;
			}
			if (pass.length < 8 || !/[A-Z]/.test(pass) || !/[0-9]/.test(pass)) {
				err.textContent = 'Use 8+ characters with an uppercase letter and a number.';
				return;
			}

			setBusy(true);
			authActionInProgress = true;
			try {
				await persistenceReady;
				await createUserWithEmailAndPassword(auth, email, pass);
				goToDashboard();
			} catch (error) {
				err.textContent = firebaseErrorToMessage(error.code);
			} finally {
				authActionInProgress = false;
				setBusy(false);
			}
		};

		window.login = async function () {
			if (authActionInProgress) return;
			const email = document.getElementById('loginEmail').value.trim();
			const pass = document.getElementById('loginPassword').value;
			const err = document.getElementById('loginError');
			err.textContent = '';

			if (!email || !pass) {
				err.textContent = 'Email and password are required.';
				return;
			}

			setBusy(true);
			authActionInProgress = true;
			try {
				await persistenceReady;
				await signInWithEmailAndPassword(auth, email, pass);
				if (document.getElementById('rememberMe').checked) {
					setCookie('savedEmail', email, 7);
				} else {
					setCookie('savedEmail', '', 0);
				}
				document.getElementById('loginPassword').value = '';
				goToDashboard();
			} catch (error) {
				err.textContent = firebaseErrorToMessage(error.code);
			} finally {
				authActionInProgress = false;
				setBusy(false);
			}
		};

		function firebaseErrorToMessage(code) {
			switch (code) {
				case 'auth/email-already-in-use':
					return 'An account with this email already exists.';
				case 'auth/invalid-email':
					return 'Enter a valid email address.';
				case 'auth/weak-password':
					return 'Choose a stronger password.';
				case 'auth/invalid-credential':
				case 'auth/wrong-password':
				case 'auth/user-not-found':
					return 'Invalid email or password.';
				case 'auth/operation-not-allowed':
					return 'This sign-in provider has not been enabled in Firebase yet.';
				case 'auth/unauthorized-domain':
					return 'This website domain is not authorized in Firebase Authentication.';
				case 'auth/popup-blocked':
					return 'Your browser blocked the sign-in popup. Allow popups and try again.';
				case 'auth/popup-closed-by-user':
				case 'auth/cancelled-popup-request':
					return 'Sign-in was cancelled.';
				case 'auth/account-exists-with-different-credential':
					return 'An account already exists with this email. Sign in with its original provider first.';
				case 'auth/network-request-failed':
					return 'Network error. Check your connection and try again.';
				default:
					return 'Sign-in failed. Please try again.';
			}
		}

		async function ssoLogin(provider) {
			if (authActionInProgress) return;
			const err = document.getElementById('loginError');
			err.textContent = '';
			setBusy(true);
			authActionInProgress = true;
			try {
				await persistenceReady;
				await signInWithPopup(auth, provider);
				goToDashboard();
			} catch (error) {
				err.textContent = firebaseErrorToMessage(error.code);
			} finally {
				authActionInProgress = false;
				setBusy(false);
			}
		}

		window.loginWithGoogle = function () {
			const provider = new GoogleAuthProvider();
			provider.setCustomParameters({ prompt: 'select_account' });
			return ssoLogin(provider);
		};

		window.loginWithGithub = function () {
			return ssoLogin(new GithubAuthProvider());
		};

		window.loginWithMicrosoft = function () {
			const provider = new OAuthProvider('microsoft.com');
			provider.setCustomParameters({ prompt: 'select_account' });
			return ssoLogin(provider);
		};

		const saved = getCookie('savedEmail');
		if (saved) {
			document.getElementById('loginEmail').value = saved;
			document.getElementById('rememberMe').checked = true;
		}

		document.getElementById('loginPassword').addEventListener('keydown', (event) => {
			if (event.key === 'Enter') window.login();
		});
		document.getElementById('regConfirm').addEventListener('keydown', (event) => {
			if (event.key === 'Enter') window.register();
		});

		onAuthStateChanged(auth, (user) => {
			if (user && !authActionInProgress) goToDashboard();
		});
	</script>
</body>
</html>
